spring.application.name=nexusmarket
server.port=${SERVER_PORT:8080}

# ==== PostgreSQL (relational data) ====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/NexusMarket}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==== MongoDB (audit trail: database audit_db, collection audit_logs) ====
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/audit_db}

# ==== Security & JWT ====
# jwt.secret must be provided by the environment and have at least 32 bytes. The default only works for local development.
jwt.secret=${JWT_SECRET:nexusmarket-local-development-secret-change-me-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=${JWT_ISSUER:nexusmarket}
# CORS: the allowed origin is read from the FRONTEND_ORIGIN environment variable (default http://localhost:5173); wildcards are rejected at startup.

# ==== Business parameters ====
nexusmarket.business.tax-rate=${BUSINESS_TAX_RATE:0.19}
nexusmarket.business.return-window-days=${BUSINESS_RETURN_WINDOW_DAYS:30}

# ==== Demonstration data (disable in production) ====
nexusmarket.seed.enabled=${SEED_ENABLED:true}
nexusmarket.seed.password=${SEED_PASSWORD:Password123*}

# ==== Logging ====
# Spring Data prints one INFO line per JPA repository while scanning for the MongoDB module; it is harmless, so it is hidden.
logging.level.org.springframework.data.repository.config.RepositoryConfigurationExtensionSupport=WARN

# ==== JSON ====
spring.jackson.deserialization.fail-on-null-for-primitives=true
spring.jackson.deserialization.fail-on-unknown-properties=true

# ==== Actuator (only health and info are exposed) ====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
