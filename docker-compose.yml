services:
  postgres-db:
    image: postgres:16
    container_name: nexusmarket-postgres
    restart: always
    environment:
      POSTGRES_DB: NexusMarket
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d NexusMarket"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-db:
    image: mongo:6.0
    container_name: nexusmarket-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  nexusmarket-app:
    build:
      context: ./nexusmarket
      dockerfile: Dockerfile
    container_name: nexusmarket-app
    working_dir: /workspace
    volumes:
      - ./nexusmarket:/workspace
      - maven_cache:/root/.m2
    ports:
      - "${HOST_SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: "${DB_URL:-jdbc:postgresql://postgres-db:5432/NexusMarket}"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo-db:27017/audit_db}
      JWT_SECRET: ${JWT_SECRET:-nexusmarket-local-development-secret-change-me-0123456789}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      DB_CREATE_DATABASE: ${DB_CREATE_DATABASE:-true}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SERVER_PORT: 8080
    depends_on:
      postgres-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy
    command: ["mvn", "-B", "spring-boot:run"]

volumes:
  postgres_data:
  mongo_data:
  maven_cache:
